name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        id: maven_build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B clean package -DskipTests 2>&1 | tee build.log

      - name: Upload Compiled Plugin JAR
        if: steps.maven_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Npcfant-2.0
          path: NpcfantCore/target/Npcfant-2.0.jar

      - name: Send Build Status & Errors to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEFAULT_WEBHOOK: "https://discord.com/api/webhooks/1564829859555840121/DIUDWfay1l5zG3k2UlU2hpnYzc6endSjE3slI658Dlh9PRmRJkhSctNaC1yyrAmc6Bv6"
          BUILD_OUTCOME: ${{ steps.maven_build.outcome }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK_URL="${DISCORD_WEBHOOK:-$DEFAULT_WEBHOOK}"

          if [ "$BUILD_OUTCOME" == "success" ]; then
            STATUS_TITLE="✅ Build Exitoso — Npc-Fant"
            COLOR=3066993
            DESCRIPTION=$(printf "El proyecto **%s** compiló correctamente en GitHub Actions.\n🔗 [Ver ejecución en GitHub](%s)\n💬 [Ir al canal de Discord](https://discord.com/channels/1132409994793451714/1449152297753116754)" "$REPO_NAME" "$RUN_URL")
          else
            STATUS_TITLE="❌ Error en Build de Maven — Npc-Fant"
            COLOR=15158332
            ERROR_LOGS=$(grep -E "\[ERROR\]" build.log | tail -n 18 || true)
            if [ -z "$ERROR_LOGS" ]; then
              ERROR_LOGS=$(tail -n 18 build.log || true)
            fi
            ERROR_LOGS=$(printf "%s" "$ERROR_LOGS" | cut -c 1-1400)
            DESCRIPTION=$(printf "Falló la compilación en **%s**.\n🔗 [Ver ejecución en GitHub](%s)\n\n**Errores detectados:**\n\`\`\`\n%s\n\`\`\`" "$REPO_NAME" "$RUN_URL" "$ERROR_LOGS")
          fi

          jq -n \
            --arg title "$STATUS_TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg actor "$COMMIT_ACTOR" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --argjson color "$COLOR" \
            '{
              username: "NpcFant CI Bot",
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                footer: {
                  text: ("Autor: " + $actor + " • Commit: " + $sha)
                }
              }]
            }' > payload.json

          curl -sS -H "Content-Type: application/json" -X POST -d @payload.json "$WEBHOOK_URL" || true

      - name: Update dependency graph
        if: steps.maven_build.outcome == 'success'
        uses: advanced-security/maven-dependency-submission-action@v4

      - name: Check Maven Build Result
        if: steps.maven_build.outcome != 'success'
        run: |
          echo "=== MAVEN BUILD ERRORS ==="
          grep -E "\[ERROR\]" build.log || tail -n 30 build.log
          exit 1
