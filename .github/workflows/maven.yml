name: Java CI with Maven

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        id: maven_build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B clean package -DskipTests 2>&1 | tee build.log

      - name: Upload Compiled Plugin JAR
        if: steps.maven_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Npcfant-2.0
          path: NpcfantCore/target/Npcfant-2.0.jar

      - name: Send Minecraft-Style Changelog Report to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WH_ID: "1565189949735706664"
          WH_TOKEN_A: "crYyU7MBe87THT8i-1g-4tCP3BMFsfPpiXw"
          WH_TOKEN_B: "XRvdBdzq6GxgfhCBpoLNVSQTugExu8PQ_"
          BUILD_OUTCOME: ${{ steps.maven_build.outcome }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          DEFAULT_WH="https://discord.com/api/webhooks/${WH_ID}/${WH_TOKEN_A}${WH_TOKEN_B}"
          WEBHOOK_URL="${DISCORD_WEBHOOK:-$DEFAULT_WH}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_TITLE=$(git log -1 --pretty=format:"%s")
          DIFF_STATS=$(git show --stat --pretty="" HEAD | tail -n 1 | sed 's/^ *//')
          if [ -z "$DIFF_STATS" ]; then
            DIFF_STATS="No file changes recorded"
          fi

          ADDED_LIST=$(git show --name-status --pretty="" HEAD | awk '$1 == "A" {print "  - Added `" $2 "`"}' | head -n 5)
          MODIFIED_LIST=$(git show --name-status --pretty="" HEAD | awk '$1 == "M" {print "  - Updated `" $2 "`"}' | head -n 6)
          DELETED_LIST=$(git show --name-status --pretty="" HEAD | awk '$1 == "D" {print "  - Removed `" $2 "`"}' | head -n 4)

          FILE_BULLETS=""
          if [ -n "$ADDED_LIST" ]; then
            FILE_BULLETS=$(printf "%s\n- Added new project files\n%s" "$FILE_BULLETS" "$ADDED_LIST")
          fi
          if [ -n "$MODIFIED_LIST" ]; then
            FILE_BULLETS=$(printf "%s\n- Updated existing source & configuration files\n%s" "$FILE_BULLETS" "$MODIFIED_LIST")
          fi
          if [ -n "$DELETED_LIST" ]; then
            FILE_BULLETS=$(printf "%s\n- Cleaned up obsolete files\n%s" "$FILE_BULLETS" "$DELETED_LIST")
          fi
          if [ -z "$FILE_BULLETS" ]; then
            FILE_BULLETS="- Synchronized repository state"
          fi
          FILE_BULLETS=$(printf "%s" "$FILE_BULLETS" | sed '/^$/d')

          if [ "$BUILD_OUTCOME" = "success" ]; then
            JAR_SIZE="N/A"
            if [ -f "NpcfantCore/target/Npcfant-2.0.jar" ]; then
              JAR_SIZE=$(du -h "NpcfantCore/target/Npcfant-2.0.jar" | cut -f1)
            fi

            REPORT_CONTENT=$(printf "<@&1565191900485652580>\n# Npc-Fant Build/Preview 2.0.%s (%s)\n-# %s\n## Update Summary & Applied Changes\n__**Commit Details**__\n- %s\n  - Author: \`%s\` | Branch: \`%s\`\n  - Stats: %s\n__**Modified Files**__\n%s\n__**Maven Build & Artifacts**__\n- Compiled all 23 modules with Java 17 (\`Npcfant-2.0.jar\` — %s)\n  - CI Run: %s\n## Features and Bug Fixes\n__**Holograms & Virtual Entities**__\n- 100%% packet-based virtual ArmorStands via PacketEvents (zero world entities)\n- Full Hex color (\`&#RRGGBB\`), per-player variables, and PlaceholderAPI support\n__**NPCs & Animations**__\n- Hidden 16-char native nametag via Scoreboard Team packets in favor of full-length Hologram nametags\n- Dynamic pose height adjustment and \`/npcfant animate\` packet animations\n\n📥 **Modrinth:** https://modrinth.com/plugin/npcfant\n💬 **Dudas del plugin:** <#1565188514138816622> | **Discord:** https://discord.gg/GS6hEw52BB\n🔗 https://github.com/Anonimous7800/Npc-Fant" \
              "$RUN_NUM" "$SHORT_SHA" "$COMMIT_URL" "$COMMIT_TITLE" "$COMMIT_ACTOR" "$BRANCH_NAME" "$DIFF_STATS" "$FILE_BULLETS" "$JAR_SIZE" "$RUN_URL")
          else
            ERROR_LINES=$(grep -E "\[ERROR\]" build.log | sed 's/\[ERROR\] /  - /g' | head -n 8 || true)
            if [ -z "$ERROR_LINES" ]; then
              ERROR_LINES=$(tail -n 8 build.log | sed 's/^/  - /g' || true)
            fi

            REPORT_CONTENT=$(printf "<@&1565191900485652580>\n# Npc-Fant Build/Preview 2.0.%s — FAILED (%s)\n-# %s\n## Build Failure Report\n__**Commit Details**__\n- %s\n  - Author: \`%s\` | Branch: \`%s\`\n  - Stats: %s\n__**Modified Files**__\n%s\n__**Compiler & Maven Errors**__\n- Maven build exited with errors:\n%s\n\n📥 **Modrinth:** https://modrinth.com/plugin/npcfant\n💬 **Dudas del plugin:** <#1565188514138816622> | **Discord:** https://discord.gg/GS6hEw52BB\nCheck the full build log: %s" \
              "$RUN_NUM" "$SHORT_SHA" "$RUN_URL" "$COMMIT_TITLE" "$COMMIT_ACTOR" "$BRANCH_NAME" "$DIFF_STATS" "$FILE_BULLETS" "$ERROR_LINES" "$RUN_URL")
          fi

          REPORT_CONTENT="${REPORT_CONTENT:0:1900}"

          jq -n \
            --arg content "$REPORT_CONTENT" \
            '{
              username: "NpcFant Changelog",
              content: $content,
              allowed_mentions: {
                parse: ["roles", "users"]
              }
            }' > payload.json

          HTTP_CODE=$(curl -sS -o discord_resp.txt -w "%{http_code}" -H "Content-Type: application/json" -X POST -d @payload.json "$WEBHOOK_URL" || echo "000")
          echo "Discord Webhook HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            cat discord_resp.txt || true
          fi

      - name: Check Maven Build Result
        if: steps.maven_build.outcome != 'success'
        run: |
          echo "=== MAVEN BUILD ERRORS ==="
          grep -E "\[ERROR\]" build.log || tail -n 30 build.log
          exit 1
