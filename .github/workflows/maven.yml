name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        id: maven_build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B clean package -DskipTests 2>&1 | tee build.log

      - name: Upload Compiled Plugin JAR
        if: steps.maven_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Npcfant-2.0
          path: NpcfantCore/target/Npcfant-2.0.jar

      - name: Send Minecraft-Style Changelog Report to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEFAULT_WEBHOOK: "https://discord.com/api/webhooks/1564829859555840121/DIUDWfay1l5zG3k2UlU2hpnYzc6endSjE3slI658Dlh9PRmRJkhSctNaC1yyrAmc6Bv6"
          BUILD_OUTCOME: ${{ steps.maven_build.outcome }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK_URL="${DISCORD_WEBHOOK:-$DEFAULT_WEBHOOK}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_TITLE=$(git log -1 --pretty=format:"%s")
          DIFF_STATS=$(git show --stat --pretty="" HEAD | tail -n 1 | sed 's/^ *//')
          [ -z "$DIFF_STATS" ] && DIFF_STATS="No file changes recorded"

          ADDED_LIST=$(git show --name-status --pretty="" HEAD | awk '$1 == "A" {print "  - Added `" $2 "`"}' | head -n 6)
          MODIFIED_LIST=$(git show --name-status --pretty="" HEAD | awk '$1 == "M" {print "  - Updated `" $2 "`"}' | head -n 8)
          DELETED_LIST=$(git show --name-status --pretty="" HEAD | awk '$1 == "D" {print "  - Removed `" $2 "`"}' | head -n 4)

          FILE_BULLETS=""
          if [ -n "$ADDED_LIST" ]; then
            FILE_BULLETS=$(printf "%s\n- Added new project files\n%s" "$FILE_BULLETS" "$ADDED_LIST")
          fi
          if [ -n "$MODIFIED_LIST" ]; then
            FILE_BULLETS=$(printf "%s\n- Updated existing source & configuration files\n%s" "$FILE_BULLETS" "$MODIFIED_LIST")
          fi
          if [ -n "$DELETED_LIST" ]; then
            FILE_BULLETS=$(printf "%s\n- Cleaned up obsolete files\n%s" "$FILE_BULLETS" "$DELETED_LIST")
          fi
          if [ -z "$FILE_BULLETS" ]; then
            FILE_BULLETS="- Synchronized repository state"
          fi

          if [ "$BUILD_OUTCOME" == "success" ]; then
            JAR_SIZE="N/A"
            if [ -f "NpcfantCore/target/Npcfant-2.0.jar" ]; then
              JAR_SIZE=$(du -h "NpcfantCore/target/Npcfant-2.0.jar" | cut -f1)
            fi

            REPORT_CONTENT=$(cat <<EOF
          # Npc-Fant Build/Preview 2.0.${GITHUB_RUN_NUMBER} (${SHORT_SHA})
          -# ${COMMIT_URL}
          ## Update Summary & Applied Changes
          __**Commit Details**__
          - ${COMMIT_TITLE}
            - Author: \`${COMMIT_ACTOR}\`
            - Branch: \`${BRANCH_NAME}\`
            - Stats: ${DIFF_STATS}
          __**Modified Files**__
          ${FILE_BULLETS}
          __**Maven Build & Artifacts**__
          - Compiled all 23 modules successfully with Java 17
            - Shaded Plugin JAR: \`Npcfant-2.0.jar\` (${JAR_SIZE})
            - Version Adapters: \`v1_17_R1\` through \`v26_3_R1\` ready
            - CI Run: ${RUN_URL}
          ## Features and Bug Fixes
          __**NPC Engine & Packets**__
          - Packet-based \`FakePlayerNPC\` and multi-entity spawning (1.17 – 26.3)
            - Safe 16-character profile sanitization with full color display names
            - Dynamic distance tracker (auto-spawn within 60 blocks, auto-despawn beyond 68 blocks)
            - Automatic head and body rotation towards nearby players
          __**Customization & Gameplay**__
          - Real-time equipment packets (\`helmet\`, \`chestplate\`, \`leggings\`, \`boots\`, \`mainhand\`, \`offhand\`)
          - Live posture updates (\`STANDING\`, \`SNEAKING\`, \`SITTING\`, \`SLEEPING\`, \`SWIMMING\`)
          - Asynchronous skin fetching (\`username\`, \`preset\`, \`file\`) and interactive \`/skingui\` menu
          - Integrated multi-line floating holograms and packet click action chains

          ...And many more!
          Discuss these changes in the official Discord channel here: https://discord.com/channels/1132409994793451714/1449152297753116754
          https://github.com/Anonimous7800/Npc-Fant
          EOF
          )
          else
            ERROR_LINES=$(grep -E "\[ERROR\]" build.log | sed 's/\[ERROR\] /  - /g' | head -n 10 || true)
            if [ -z "$ERROR_LINES" ]; then
              ERROR_LINES=$(tail -n 10 build.log | sed 's/^/  - /g' || true)
            fi

            REPORT_CONTENT=$(cat <<EOF
          # Npc-Fant Build/Preview 2.0.${GITHUB_RUN_NUMBER} — FAILED (${SHORT_SHA})
          -# ${RUN_URL}
          ## Build Failure Report
          __**Commit Details**__
          - ${COMMIT_TITLE}
            - Author: \`${COMMIT_ACTOR}\`
            - Branch: \`${BRANCH_NAME}\`
            - Stats: ${DIFF_STATS}
          __**Modified Files**__
          ${FILE_BULLETS}
          __**Compiler & Maven Errors**__
          - Maven build exited with errors during CI execution:
          ${ERROR_LINES}

          Check the full build log and discuss fixes here: https://discord.com/channels/1132409994793451714/1449152297753116754
          ${RUN_URL}
          EOF
          )
          fi

          REPORT_CONTENT=$(printf "%s" "$REPORT_CONTENT" | sed 's/^          //')
          REPORT_CONTENT=$(printf "%s" "$REPORT_CONTENT" | cut -c 1-1950)

          jq -n \
            --arg content "$REPORT_CONTENT" \
            '{
              username: "NpcFant Changelog",
              content: $content
            }' > payload.json

          curl -sS -H "Content-Type: application/json" -X POST -d @payload.json "$WEBHOOK_URL" || true

      - name: Check Maven Build Result
        if: steps.maven_build.outcome != 'success'
        run: |
          echo "=== MAVEN BUILD ERRORS ==="
          grep -E "\[ERROR\]" build.log || tail -n 30 build.log
          exit 1
