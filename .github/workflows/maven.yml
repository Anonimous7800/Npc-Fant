name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        id: maven_build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B clean package -DskipTests 2>&1 | tee build.log

      - name: Upload Compiled Plugin JAR
        if: steps.maven_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Npcfant-2.0
          path: NpcfantCore/target/Npcfant-2.0.jar

      - name: Send Detailed Changelog & Build Report to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEFAULT_WEBHOOK: "https://discord.com/api/webhooks/1564829859555840121/DIUDWfay1l5zG3k2UlU2hpnYzc6endSjE3slI658Dlh9PRmRJkhSctNaC1yyrAmc6Bv6"
          BUILD_OUTCOME: ${{ steps.maven_build.outcome }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK_URL="${DISCORD_WEBHOOK:-$DEFAULT_WEBHOOK}"

          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | cut -c 1-250)
          CHANGED_FILES=$(git show --name-status --pretty="" HEAD | head -n 15 | sed 's/\t/  /g')
          TOTAL_CHANGED=$(git show --name-only --pretty="" HEAD | wc -l | tr -d ' ')
          DIFF_STATS=$(git show --stat --pretty="" HEAD | tail -n 1 | sed 's/^ *//')

          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="Sin archivos modificados en este commit"
          elif [ "$TOTAL_CHANGED" -gt 15 ]; then
            EXTRA=$((TOTAL_CHANGED - 15))
            CHANGED_FILES=$(printf "%s\n... y %d archivo(s) más" "$CHANGED_FILES" "$EXTRA")
          fi

          if [ -z "$DIFF_STATS" ]; then
            DIFF_STATS="0 files changed"
          fi

          if [ "$BUILD_OUTCOME" == "success" ]; then
            STATUS_TITLE="✅ Build & Cambios Aplicados — Npc-Fant"
            COLOR=3066993
            JAR_SIZE="N/A"
            if [ -f "NpcfantCore/target/Npcfant-2.0.jar" ]; then
              JAR_SIZE=$(du -h "NpcfantCore/target/Npcfant-2.0.jar" | cut -f1)
            fi
            BUILD_SUMMARY="Compilación exitosa de los **23 módulos** (JDK 17).\n📦 Artefacto generado: \`Npcfant-2.0.jar\` (${JAR_SIZE})\n🔗 [Ver Build en GitHub](${RUN_URL}) • [Ver Commit](${COMMIT_URL})"
            DETAILS_NAME="💡 Estado y Recomendaciones"
            DETAILS_VALUE="• Todos los adaptadores NMS (\`v1_17_R1\` – \`v26_3_R1\`) y \`NpcfantCore\` compilaron sin errores.\n• Listo para descargar desde GitHub Actions Artifacts o desplegar en el servidor."
          else
            STATUS_TITLE="❌ Error en Build de Maven — Npc-Fant"
            COLOR=15158332
            BUILD_SUMMARY="Falló la compilación en **${REPO_NAME}** (rama \`${BRANCH_NAME}\`).\n🔗 [Ver Build en GitHub](${RUN_URL}) • [Ver Commit](${COMMIT_URL})"
            ERROR_LOGS=$(grep -E "\[ERROR\]" build.log | tail -n 12 || true)
            if [ -z "$ERROR_LOGS" ]; then
              ERROR_LOGS=$(tail -n 12 build.log || true)
            fi
            ERROR_LOGS=$(printf "%s" "$ERROR_LOGS" | cut -c 1-950)
            DETAILS_NAME="🚨 Errores de Compilación Detectados"
            DETAILS_VALUE=$(printf "\`\`\`\n%s\n\`\`\`" "$ERROR_LOGS")
          fi

          FILES_BLOCK=$(printf "\`\`\`\n%s\n\`\`\`\n📊 **Resumen:** %s" "$CHANGED_FILES" "$DIFF_STATS")

          jq -n \
            --arg title "$STATUS_TITLE" \
            --arg desc "$BUILD_SUMMARY" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg files_block "$FILES_BLOCK" \
            --arg details_name "$DETAILS_NAME" \
            --arg details_val "$DETAILS_VALUE" \
            --arg actor "$COMMIT_ACTOR" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --argjson color "$COLOR" \
            '{
              username: "NpcFant CI Bot",
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                fields: [
                  {
                    name: "📝 Cambio Aplicado (Commit)",
                    value: ("`" + $sha + "` — " + $commit_msg),
                    inline: false
                  },
                  {
                    name: "📂 Archivos Modificados (A = Añadido, M = Modificado, D = Eliminado)",
                    value: $files_block,
                    inline: false
                  },
                  {
                    name: $details_name,
                    value: $details_val,
                    inline: false
                  }
                ],
                footer: {
                  text: ("Autor: " + $actor + " • Rama: " + $branch + " • Commit: " + $sha)
                }
              }]
            }' > payload.json

          curl -sS -H "Content-Type: application/json" -X POST -d @payload.json "$WEBHOOK_URL" || true

      - name: Check Maven Build Result
        if: steps.maven_build.outcome != 'success'
        run: |
          echo "=== MAVEN BUILD ERRORS ==="
          grep -E "\[ERROR\]" build.log || tail -n 30 build.log
          exit 1
