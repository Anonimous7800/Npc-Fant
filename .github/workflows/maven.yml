name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        id: maven_build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B clean package -DskipTests 2>&1 | tee build.log

      - name: Upload Compiled Plugin JAR
        if: steps.maven_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Npcfant-2.0
          path: NpcfantCore/target/Npcfant-2.0.jar

      - name: Send Build Status & Errors to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_OUTCOME: ${{ steps.maven_build.outcome }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Aviso: El secret DISCORD_WEBHOOK no esta configurado en GitHub Settings -> Secrets -> Actions."
            exit 0
          fi

          if [ "$BUILD_OUTCOME" == "success" ]; then
            STATUS_TITLE="✅ Build Exitoso — Npc-Fant"
            COLOR=3066993
            DESCRIPTION="El proyecto **${REPO_NAME}** compilo correctamente en GitHub Actions.\n🔗 [Ver ejecucion en GitHub](${RUN_URL})\n💬 [Canal de Discord](https://discord.com/channels/1132409994793451714/1449152297753116754)"
          else
            STATUS_TITLE="❌ Error en Build de Maven — Npc-Fant"
            COLOR=15158332
            ERROR_LOGS=$(grep -E "\[ERROR\]" build.log | tail -n 20 || tail -n 20 build.log)
            if [ -z "$ERROR_LOGS" ]; then
              ERROR_LOGS=$(tail -n 20 build.log)
            fi
            ERROR_LOGS=$(echo "$ERROR_LOGS" | cut -c 1-1500)
            DESCRIPTION="Fallo la compilacion en **${REPO_NAME}**.\n🔗 [Ver ejecucion en GitHub](${RUN_URL})\n\n**Errores detectados:**\n\`\`\`\n${ERROR_LOGS}\n\`\`\`"
          fi

          jq -n \
            --arg title "$STATUS_TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg actor "$COMMIT_ACTOR" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --argjson color "$COLOR" \
            '{
              username: "NpcFant CI Bot",
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                footer: {
                  text: ("Autor: " + $actor + " • Commit: " + $sha)
                }
              }]
            }' > payload.json

          curl -s -H "Content-Type: application/json" -X POST -d @payload.json "$DISCORD_WEBHOOK"

      - name: Fail Job if Maven Build Failed
        if: steps.maven_build.outcome != 'success'
        run: exit 1

      - name: Update dependency graph
        if: steps.maven_build.outcome == 'success'
        uses: advanced-security/maven-dependency-submission-action@v4
